name: Mango firmware candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/mango-candidate.yml'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  mango:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate MikroWrt tooling first
        run: |
          python3 -m unittest discover -s tests -v
          sh -n scripts/bootstrap-openwrt.sh scripts/select-mango.sh scripts/build-firmware.sh
      - name: Check runner capacity
        run: |
          df -h .
          free -h
          available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$available_kib" -lt 20971520 ]; then
            echo "::error::Less than 20 GiB available for OpenWrt build"
            exit 1
          fi
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl subversion time libelf-dev
      - name: Checkout pinned upstream
        run: sh scripts/bootstrap-openwrt.sh
      - name: Install OpenWrt feeds
        run: |
          cd upstream/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Select Mango target
        run: sh scripts/select-mango.sh
      - name: Resolve target and inspect selected packages
        run: |
          cd upstream/openwrt
          make defconfig
          cd ../..
          python3 scripts/report-packages.py upstream/openwrt/.config --output build-output/packages-prebuild.json
          python3 scripts/check-usability.py upstream/openwrt/.config --require-ssh --output build-output/usability-prebuild.json
      - name: Build candidate (no flashing)
        env:
          BUILD_JOBS: "2"
          MIKROWRT_REQUIRE_SSH: "1"
        run: sh scripts/build-firmware.sh
      - name: Require Mango-specific firmware image
        run: |
          python3 scripts/report-images.py upstream/openwrt/bin/targets \
            --require-images --require-name gl-mt300n-v2 \
            --output build-output/mango-images.json
      - name: Record candidate source revision and runner disk use
        if: always()
        run: |
          mkdir -p build-output
          if [ -d upstream/openwrt/.git ]; then
            git -C upstream/openwrt rev-parse HEAD > build-output/upstream-commit.txt
          fi
          df -h . > build-output/runner-disk.txt
      - name: Upload reports and candidate images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mango-candidate-unqualified
          path: |
            build-output/
            upstream/openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 7
